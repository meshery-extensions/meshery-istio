    staticcheck:
      checks:
        - all
        - "-ST1000" # temporarily disabled.
        - "-ST1003" # temporarily disabled.
        - "-ST1005" # temporarily disabled.
        - "-ST1020" # temporarily disabled.
        - "-ST1021" # temporarily disabled.
